      const setM=(x.s||"").match(/^(\d+)\s*[×x]/); const nAll=setM?Math.min(+setM[1],12):1; const nSets=x.load?Math.min(nAll,6):nAll;
      const sets=(dd.sets||{})[x.id]||[]; const nDone=Array.from({length:nSets}).filter((_,k)=>sets[k]).length;
      const tick=(k,sz)=>{const on=!!sets[k];return `<div data-act="set" data-id="${x.id}" data-k="${k}" data-n="${nSets}" style="width:${sz}px;height:${sz}px;border-radius:50%;border:1.5px solid ${on?C.green:C.muted};background:${on?C.green:"transparent"};color:${on?C.ink:C.muted};display:flex;align-items:center;justify-content:center;font-family:${F.mono};font-size:10px;font-weight:700;cursor:pointer">${on?"✓":k+1}</div>`;};
      h+=`<div data-act="ex" data-id="${x.id}" data-n="${nSets}" style="display:flex;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;opacity:${done?.5:1}">
        <div style="width:22px;height:22px;border-radius:6px;border:1.5px solid ${done?C.green:C.muted};background:${done?C.green:"transparent"};flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:${C.ink};font-weight:700;margin-top:1px">${done?"✓":""}</div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
            <span style="font-size:13.5px;color:${C.text};font-weight:500;${done?"text-decoration:line-through":""}">${e(x.ic)} ${e(P(x.n))}</span>
            ${x.s&&x.s!=="—"?`<span style="font-family:${F.mono};font-size:11px;color:${C.lime};font-weight:600;white-space:nowrap;flex-shrink:0">${e(P(x.s))}</span>`:""}</div>
          ${x.note?`<div style="font-size:11px;color:${C.muted};line-height:1.45;margin-top:2px">${e(P(x.note))}</div>`:""}
          ${x.load?`<div data-noex="1" style="margin-top:7px"><div style="${lblS};font-size:8.5px;margin-bottom:5px">Load per set · kg · tick each set${last.some(v=>v)?" · grey = last time":""}</div>
            <div style="display:flex;gap:5px;flex-wrap:wrap">${Array.from({length:nSets}).map((_,k)=>{const v=own[k]!=null?own[k]:"";
              return `<div style="display:flex;flex-direction:column;align-items:center;gap:2px"><input type="text" inputmode="decimal" data-w="${x.id}" data-wkey="${e(wkey)}" data-dk="${dk}" data-set="${k}" value="${e(v)}" placeholder="${e(last[k]||"kg")}" style="${inpS};width:48px;border-color:${v?C.purple:C.border}"/>${tick(k,26)}</div>`;}).join("")}</div></div>`
            :nSets>1?`<div data-noex="1" style="margin-top:7px;display:flex;gap:5px;flex-wrap:wrap;align-items:center">${Array.from({length:nSets}).map((_,k)=>tick(k,26)).join("")}<span style="font-family:${F.mono};font-size:9px;color:${C.muted};margin-left:4px">${nDone}/${nSets}</span></div>`:""}
        </div></div>`; });
    h+=`</div>`; });
  h+=`<div style="margin-top:16px"><div style="${lblS};margin-bottom:5px">Notes / times</div>
    <textarea data-field="note" data-dk="${dk}" rows="2" placeholder="Paces, weights, HR, how it felt…" style="width:100%;background:${C.card};border:1px solid ${C.border};border-radius:8px;padding:9px 10px;color:${C.text};font-size:12.5px;outline:none;resize:vertical">${e(dd.note||"")}</textarea></div>
  ${dd.skipped&&!dd.completed?`<div style="margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;border-radius:10px;border:1px dashed ${C.muted};color:${C.muted};font-family:${F.mono};font-size:11px;letter-spacing:.06em">SKIPPED · not counted<span data-act="unskip" style="color:${C.text};border:1px solid ${C.border};border-radius:8px;padding:6px 10px;cursor:pointer">UNSKIP</span></div>`:""}
  <button data-act="complete" style="width:100%;margin-top:12px;padding:13px;border-radius:10px;border:1px solid ${GOLD};background:${dd.completed?GOLD:"transparent"};color:${dd.completed?C.ink:GOLD};font-family:${F.disp};font-size:16px;letter-spacing:.14em;cursor:pointer">${dd.completed?"✓ SESSION DONE":"MARK SESSION DONE"}</button>
  ${!dd.completed&&!dd.skipped?`<button data-act="skip" style="width:100%;margin-top:8px;padding:10px;border-radius:10px;border:none;background:transparent;color:${C.muted};font-family:${F.mono};font-size:11px;letter-spacing:.08em;cursor:pointer;text-decoration:underline;text-underline-offset:3px">SKIP THIS SESSION → NEXT</button>`:""}
  </div>`;
  TREAD=false; return h;
}

// ── Train ──
function train(){
  const days=getDays(S.week),note=wNote(S.week),curPhase=phOf(S.week),cur=days[S.day],ph=PHASES[curPhase-1];
  let h=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px">`;
  PHASES.forEach(b=>{ const on=curPhase===b.id; let done=0,total=0;
    b.weeks.forEach(w=>getDays(w).forEach((d,i)=>{ if(isReq(d)){total++; if(st(w,i).completed)done++;} }));
    const pct=total?Math.round(done/total*100):0;
    h+=`<div data-act="phase" data-v="${b.id}" style="background:${C.card};border:1px solid ${on?C.lime:C.border};border-radius:12px;padding:9px 9px 8px;cursor:pointer;${on?`box-shadow:0 0 14px ${A(C.lime,.12)}`:""}">
      <div style="font-family:${F.mono};font-size:7.5px;color:${C.muted};letter-spacing:.14em">PHASE ${b.id}</div>
      <div style="font-family:${F.disp};font-size:15px;color:${on?C.lime:C.text};line-height:1.05;margin:2px 0 2px">${b.title}</div>
      <div style="font-family:${F.mono};font-size:8.5px;color:${on?C.lime:C.muted}">${b.wks}</div>
      <div style="margin-top:6px">${bar(pct,on?C.lime:C.muted)}</div></div>`; });
  h+=`</div><div style="font-size:11px;color:${C.muted};line-height:1.5;margin:0 2px 10px">${e(ph.desc)}</div>`;
  h+=`<div style="display:flex;gap:5px;background:${C.surface};border:1px solid ${C.border};border-radius:12px;padding:5px;margin-bottom:12px">`;
  ph.weeks.forEach(w=>{ const on=w===S.week,wc=weekComplete(w);
    h+=`<div data-act="week" data-v="${w}" style="flex:1;text-align:center;padding:10px 2px;border-radius:9px;background:${on?C.lime:"transparent"};color:${on?C.ink:C.muted};font-family:${F.mono};font-size:12.5px;font-weight:700;cursor:pointer;position:relative">Wk${w}${wc&&!on?`<span style="position:absolute;top:5px;right:6px;width:5px;height:5px;border-radius:50%;background:${C.green}"></span>`:""}</div>`; });
  h+=`</div>
  <div style="background:${A(C.blue,.05)};border:1px solid ${A(C.blue,.2)};border-radius:11px;padding:11px 13px;margin-bottom:12px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px">
      <span style="font-family:${F.disp};font-size:16px;color:${C.text};letter-spacing:.03em">${e(note.h)}</span>
      <span style="font-family:${F.mono};font-size:9px;color:${C.blue};white-space:nowrap">${e(note.rpe)}</span></div>
    <div style="font-family:${F.mono};font-size:11px;color:${C.blue};margin-bottom:3px">~${weekKm(S.week)} km · ~${weekKcal(S.week).toLocaleString("en-GB")} kcal training burn</div>
    <div style="font-family:${F.mono};font-size:9px;color:${C.muted}">${weekRange(S.week)} · days are flexible · ${dtr()} days to race</div>
    <div data-act="order" style="margin-top:7px;font-family:${F.mono};font-size:10px;color:${C.lime};cursor:pointer">${S.order?"▾":"▸"} Order rules — if you swap days</div>
    ${S.order?`<div style="margin-top:6px">${ORDER.map(([k,v])=>`<div style="display:flex;gap:8px;padding:3px 0;font-size:11.5px;line-height:1.45"><span style="color:${C.lime}">›</span><span style="color:${C.muted}"><b style="color:${C.text}">${k}</b> ${v}</span></div>`).join("")}</div>`:""}</div>`;
  h+=`<div style="display:flex;gap:5px;margin-bottom:16px">`;
  days.forEach((d,i)=>{ const s=st(S.week,i),done=s.completed,sk=!done&&s.skipped,on=i===S.day;
    h+=`<div data-act="day" data-v="${i}" style="flex:1 1 0;min-width:0;padding:7px 1px 6px;border-radius:9px;border:1px solid ${on?d.c:C.border};background:${on?d.c:done?A(C.green,.1):"transparent"};color:${on?C.ink:done?C.green:C.muted};cursor:pointer;text-align:center;position:relative;${sk&&!on?"border-style:dashed;opacity:.55":""}${d.optional&&!on?";opacity:.7":""}">
      <div style="font-family:${F.disp};font-size:12px;letter-spacing:.04em">${d.num}</div><div style="font-family:${F.mono};font-size:7.5px;letter-spacing:.08em;margin-top:3px;opacity:.85">${done&&!on?"✓ DONE":TAGS[d.tag]}</div></div>`; });
  return h+`</div>`+dayCard(cur,`w${S.week}d${S.day}`);
}

// ── Fuel ──
function fuel(){
  const tabs=[["days","Day Types"],["around","Sessions"],["long","Long Runs"],["race","Race"],["enough","Enough?"]];
  const SH=(x,c)=>`<div style="font-family:${F.disp};font-size:18px;color:${c||C.lime};letter-spacing:.03em;margin:16px 0 8px">${x}</div>`;
  const row=(k,v,c)=>`<div style="display:flex;justify-content:space-between;gap:12px;padding:9px 12px;background:${C.card};border-radius:8px;margin-bottom:5px;align-items:flex-start"><span style="font-family:${F.mono};font-size:11px;color:${c||C.muted};font-weight:600">${k}</span><span style="font-size:11.5px;color:${C.muted};line-height:1.5;text-align:right">${v}</span></div>`;
  const box=(t,c)=>`<div style="background:${A(c||C.orange,.06)};border:1px solid ${A(c||C.orange,.22)};border-radius:10px;padding:11px 12px;margin-top:12px;font-size:12px;color:${C.muted};line-height:1.6">${t}</div>`;
  let h=`<div class="fade"><div style="font-family:${F.disp};font-size:28px;letter-spacing:.03em;color:${C.text}">FUEL <span style="color:${C.orange}">GUIDE</span></div>
    <div style="font-family:${F.mono};font-size:10px;color:${C.muted};margin-bottom:12px">Protein anchored 140–148g · fat ≥ 50–60g · carbs are the lever</div>
    <div style="display:flex;gap:2px;background:${C.surface};border:1px solid ${C.border};border-radius:10px;padding:3px;margin-bottom:6px">`;
  tabs.forEach(([id,l])=>{ const on=S.fuel===id;
    h+=`<div data-act="fuel" data-v="${id}" style="flex:1;padding:8px 2px;border-radius:8px;background:${on?C.orange:"transparent"};color:${on?C.ink:C.muted};font-family:${F.mono};font-size:9px;font-weight:${on?700:400};cursor:pointer;white-space:nowrap;text-align:center">${l}</div>`; });
  h+=`</div>`;
  if(S.fuel==="days"){
    h+=box(`Set at roughly <b style="color:${C.text}">maintenance</b> — enough to build muscle while the mileage climbs. You're at 12.7% body fat; definition comes from muscle gain at a steady fat %, not a further cut. Averages ≈ <b style="color:${C.text}">2,500 kcal/day</b> on a normal week, ≈ 2,800 at peak.`);
    h+=SH("Targets by day type",C.orange);
    Object.values(MAC).forEach(m=>{ h+=`<div style="background:${C.card};border-radius:9px;padding:10px 12px;margin-bottom:6px">
      <div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:12.5px;color:${C.text};font-weight:600">${m.l}</span><span style="font-family:${F.disp};font-size:17px;color:${C.orange}">~${m.k.toLocaleString("en-GB")}</span></div>
      <div style="display:flex;gap:12px;margin-top:4px;font-family:${F.mono};font-size:11px;color:${C.muted}"><span>P <b style="color:${C.text}">${m.p}g</b></span><span>C <b style="color:${C.text}">${m.c}g</b> (${(m.c/BODY_KG).toFixed(1)} g/kg)</span><span>F <b style="color:${C.text}">${m.f}g</b></span></div></div>`; });
    h+=`<div style="font-size:10.5px;color:${C.muted};margin-top:8px;line-height:1.5">Long-run and yard-sim totals include what you eat during the run. Estimates from your 5 Nov InBody (61.2 kg · BMR 1524) — starting points, adjust with the Enough? tab.</div>`;
  } else if(S.fuel==="around"){
    h+=SH("Before");
    [["Hard + early","20–30g fast carbs: banana, rice cakes + honey, juice"],["Easy runs","Can stay fasted if you feel good"],["Early long runs","30–40g fast carbs 15–30 min before · start fuelling at 30 min"],["Later long runs","Breakfast 2–3h before · 60–90g carbs"],["Race rehearsal","2–3 yard sims with your real race breakfast, 3h before"],["The real lever","Carb-rich dinner the night before hard days"]].forEach(([k,v])=>h+=row(k,v,C.lime));
    h+=SH("After");
    [["Within 1–2h","30–40g protein + carbs"],["Overnight oats","Still perfect post-session (65g C · 41g P)"]].forEach(([k,v])=>h+=row(k,v,C.lime));
    h+=SH("Through the day");
    [["Protein spread","~4 × 35g meals — lunch included (≥35g keeps the afternoon hunger down)"],["Big dinner","Fine — put most of the carbs there before hard mornings"],["Hydration","Water all day · electrolytes on sweaty sessions"]].forEach(([k,v])=>h+=row(k,v,C.lime));
  } else if(S.fuel==="long"){
    h+=box(`Your gut is trainable. Log every long run and yard sim in the session's fuel log — by May you want <b style="color:${C.text}">60–75g carbs/hour</b> to feel boring.`,C.lime);
    h+=SH("Carbs per hour — progression");
    [["Wk 1–6","30–40g/h from 45–60 min"],["Wk 7–12","45g/h"],["Wk 13+","60–75g/h · mix gels + real food"]].forEach(([k,v])=>h+=row(k,v,C.orange));
    h+=SH("Every long run");
    [["Fluids","400–800 ml/h (more in heat)"],["Sodium","300–600 mg/h"],["Real food","Practise from Wk 13: salted potatoes, wraps, rice balls"],["Rule","Race only with what you've trained with"]].forEach(([k,v])=>h+=row(k,v,C.orange));
  } else if(S.fuel==="race"){
    h+=SH("Race week");
    [["Mon–Wed","Normal eating · hydrate · nothing new"],["Thu–Fri","Carb-load 8–10 g/kg (~500–600g/day) · low fibre Friday"],["Scale up?","Expected — glycogen holds water. Fuel, not fat."],["Race morning","Breakfast 3h before · 80–100g carbs · same as your sims"]].forEach(([k,v])=>h+=row(k,v,C.lime));
    h+=SH("During — per yard");
    [["Carbs","50–70g per yard, eaten in the first 3 min of the break"],["Real food","Salty food from yard 4"],["Protein","10–15g every 3–4 yards"],["Fluids","500–700 ml per yard, by temperature"],["Caffeine","Save it for the evening yards"]].forEach(([k,v])=>h+=row(k,v,C.lime));
  } else {
    h+=SH("Are you eating enough?",C.orange);
    h+=box(`If two or more creep in, <b style="color:${C.text}">eat more — mostly carbs</b>, don't train harder:<div style="margin-top:8px">${["WHOOP HRV down / RHR up for several days","Runs or circuits stalling at the same effort","Broken sleep despite fatigue","Always cold","Niggles that won't clear","Low mood or short fuse","Any change to your cycle"].map(x=>`<div style="display:flex;gap:8px;padding:3px 0"><span style="color:${C.orange}">›</span><span>${x}</span></div>`).join("")}</div>`);
    h+=SH("Adjust from your scans");
    [["Weight or SMM down over 2 scans","+150–200 kcal/day, from carbs"],["HRV down several days","+150–200 kcal carbs · check sleep"],["PBF up >1 pt, SMM flat","−150 kcal carbs on rest days only"]].forEach(([k,v])=>h+=row(k,v,C.orange));
    h+=`<div style="font-size:11px;color:${C.muted};margin-top:10px;line-height:1.5">These are estimates. A sports dietitian can fine-tune ultra fuelling with you — worth it before the peak block.</div>`;
  }
  return h+`</div>`;
}

// ── Run (paces · goal · km · yard log) ──
function run(){
  const z=zones();
  let h=`<div class="fade"><div style="font-family:${F.disp};font-size:28px;letter-spacing:.03em;color:${C.text}">RUN <span style="color:${C.blue}">PACES</span></div>
    <div style="font-family:${F.mono};font-size:10px;color:${C.muted};margin-bottom:14px">Every session's paces update from your 10k time</div>
    <div style="background:${C.card};border:1px solid ${A(C.blue,.3)};border-radius:11px;padding:12px 13px;display:flex;justify-content:space-between;align-items:center;gap:10px">
      <div><div style="${lblS}">Current 10k</div><div style="font-size:11px;color:${C.muted};margin-top:2px">Re-set after the Wk 12 time trial</div></div>
      <input type="text" inputmode="numeric" data-tenk="1" value="${e(mmss(tenk()))}" style="${inpS};width:84px;font-size:16px;font-family:${F.disp};color:${C.blue};border-color:${A(C.blue,.4)}"/></div>`;
  h+=`<div style="margin-top:12px">`;
  [["E","Easy / Z2","Most of your running · long runs",C.green],["Y","Yard pace","48–52 min per 6.7 km · walk hills",C.lime],["HM","Half marathon","Time trial · fast finishes",C.blue],["T","Threshold","Tempo · cruise intervals",C.orange],["I","Intervals","800m–1.2km repeats",C.red],["R","Reps","400m · hills · openers",C.purple]].forEach(([k,n,d,c])=>{
    const [a,b]=z[k]; h+=`<div style="display:flex;align-items:center;gap:10px;padding:9px 12px;background:${C.card};border-radius:9px;margin-bottom:5px;border-left:3px solid ${c}">
      <div style="flex:1"><div style="font-size:12.5px;color:${C.text};font-weight:600">${n}</div><div style="font-size:10.5px;color:${C.muted}">${d}</div></div>
      <div style="text-align:right"><div style="font-family:${F.disp};font-size:15px;color:${c}">${mmss(a)}–${mmss(b)}</div><div style="font-family:${F.mono};font-size:9px;color:${C.muted}">/km · ${kmh(b)}–${kmh(a)} km/h</div></div></div>`; });
  h+=`</div>`;
  const g=+(DATA.goal||6);
  h+=`<div style="${lblS};margin:18px 0 6px">Race goal · yards</div><div style="display:flex;gap:5px;flex-wrap:wrap">`;
  [4,5,6,7,8,10,12,15].forEach(y=>{ const on=g===y; h+=`<div data-act="goal" data-v="${y}" style="flex:1;min-width:34px;text-align:center;padding:9px 0;border-radius:8px;border:1px solid ${on?C.lime:C.border};background:${on?C.lime:"transparent"};color:${on?C.ink:C.muted};font-family:${F.mono};font-size:12px;font-weight:700;cursor:pointer">${y}</div>`; });
  h+=`</div><div style="font-size:11px;color:${C.muted};margin-top:6px">${g} yards = ${(g*YARD).toFixed(1)} km${g*YARD>42.2?" · beyond marathon distance":""} · ${g} hours on your feet</div>`;
  const kms=[]; for(let w=1;w<=NWEEKS;w++) kms.push(weekKm(w)); const mx=Math.max(...kms);
  h+=`<div style="${lblS};margin:18px 0 8px">Weekly km — plan</div>
    <div style="display:flex;align-items:flex-end;gap:2px;height:110px;background:${C.card};border-radius:10px;padding:10px 8px 6px">`;
  kms.forEach((k,i)=>{ const w=i+1,on=w===S.week; h+=`<div data-act="jumpweek" data-w="${w}" title="Wk${w}: ${k} km" style="flex:1;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%">
    ${on?`<div style="font-family:${F.mono};font-size:8px;color:${C.lime};margin-bottom:2px">${k}</div>`:""}
    <div style="width:100%;height:${Math.round(k/mx*80)}%;background:${on?C.lime:weekComplete(w)?C.green:A(C.blue,.45)};border-radius:2px 2px 0 0"></div></div>`; });
  h+=`</div><div style="display:flex;justify-content:space-between;font-family:${F.mono};font-size:8.5px;color:${C.muted};margin-top:3px"><span>Wk1</span><span>Wk12</span><span>Wk23</span></div>`;
  // yard log
  let logs="";
  for(let w=1;w<=NWEEKS;w++) getDays(w).forEach((d,i)=>{ const ysec=(d.secs||[]).find(s=>s.yards); if(!ysec) return;
    const laps=(st(w,i).yards||[]).map(ps).filter(Boolean); if(!laps.length) return;
    const avg=laps.reduce((a,b)=>a+b,0)/laps.length, mb=Math.min(...laps.map(s=>3600-s));
    logs+=`<div data-act="jump" data-w="${w}" data-d="${i}" style="display:flex;justify-content:space-between;gap:8px;padding:9px 12px;background:${C.card};border-radius:8px;margin-bottom:5px;cursor:pointer">
      <span style="font-family:${F.mono};font-size:11px;color:${C.lime}">Wk${w} ${d.num}</span><span style="font-size:11.5px;color:${C.text}">${laps.length} yards · ${(laps.length*YARD).toFixed(1)} km</span>
      <span style="font-family:${F.mono};font-size:10.5px;color:${C.muted}">avg ${mmss(avg)} · min rest ${mmss(Math.max(0,mb))}</span></div>`; });
  h+=`<div style="${lblS};margin:18px 0 6px">Yard log</div>${logs||`<div style="font-size:11.5px;color:${C.muted}">Your yard sims will show here — first one is Wk 13.</div>`}`;
  return h+`</div>`;
}

// ── Progress ──
function progress(){
  let done=0,rows="";
  for(let w=1;w<=NWEEKS;w++){ const days=getDays(w); let cells="";
    days.forEach((d,di)=>{ const s=st(w,di),c=s.completed,sk=!c&&s.skipped; if(c&&isReq(d))done++;
      cells+=`<div data-act="jump" data-w="${w}" data-d="${di}" style="flex:1;height:28px;border-radius:6px;border:1px ${sk?"dashed":"solid"} ${c?C.green:C.border};background:${c?A(C.green,.18):d.rest?"rgba(255,255,255,.02)":"transparent"};color:${c?C.green:C.muted};display:flex;align-items:center;justify-content:center;font-size:${c?11:12}px;cursor:pointer;${sk?"opacity:.5":""}${d.optional&&!c?";opacity:.55":""}">${c?"✓":sk?"–":d.num}</div>`; });
    rows+=`<div style="margin-bottom:7px"><div style="display:flex;justify-content:space-between;font-family:${F.mono};font-size:9px;color:${w===S.week?C.lime:C.muted};margin-bottom:3px;letter-spacing:.06em"><span>WEEK ${w} · ${PHASES[phOf(w)-1].title}</span><span>${weekKm(w)} km</span></div><div style="display:flex;gap:4px">${cells}</div></div>`; }
  const pct=Math.round(done/TOTAL*100);
  return `<div class="fade"><div style="font-family:${F.disp};font-size:28px;letter-spacing:.03em;color:${C.text}">PROGRESS</div>
    <div style="font-family:${F.mono};font-size:10px;color:${C.muted};margin-bottom:14px">${done} of ${TOTAL} sessions · ${dtr()} days to Brighton</div>
    <div style="background:${C.card};border:1px solid ${C.border};border-radius:11px;padding:14px;margin-bottom:16px;text-align:center"><div style="font-family:${F.disp};font-size:42px;color:${C.lime};line-height:1">${pct}%</div><div style="margin:8px 0">${bar(pct,C.lime)}</div><div style="font-family:${F.mono};font-size:10px;color:${C.muted}">programme complete</div></div>${rows}
    <div style="background:${C.surface};border:1px solid ${A(C.blue,.25)};border-radius:12px;padding:14px;margin-top:18px">
      <div style="font-family:${F.mono};font-size:9px;color:${C.blue};letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px">Backup & Restore</div>
      <div style="font-size:11.5px;color:${C.muted};line-height:1.55;margin-bottom:11px">Your logs live only on this device. Export a copy before any update or phone change — then Import to bring it back.</div>
      <div style="display:flex;gap:8px">
        <button data-act="export" style="flex:1;padding:11px;border-radius:9px;border:1px solid ${C.blue};background:${C.blue};color:${C.ink};font-family:${F.disp};font-size:15px;letter-spacing:.05em;cursor:pointer">EXPORT</button>
        <button data-act="import" style="flex:1;padding:11px;border-radius:9px;border:1px solid ${C.border};background:transparent;color:${C.text};font-family:${F.disp};font-size:15px;letter-spacing:.05em;cursor:pointer">IMPORT</button></div></div></div>`;
}

function modal(inner){
  const old=document.getElementById("modal"); if(old) old.remove();
  const w=document.createElement("div"); w.id="modal";
  w.style.cssText=`position:fixed;inset:0;z-index:120;background:${A(C.bg,.86)};backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;animation:ovin .2s ease`;
  const c=document.createElement("div");
  c.style.cssText=`width:340px;max-width:100%;background:linear-gradient(180deg,${C.card},${C.surface});border:1px solid ${C.border};border-radius:18px;padding:18px`;
  c.innerHTML=noEmo(inner); w.appendChild(c);
  w.addEventListener("click",ev=>{ if(ev.target===w||(ev.target.hasAttribute&&ev.target.hasAttribute("data-close"))) w.remove(); });
  document.body.appendChild(w); return w;
}
const mBtn=(act,label,bg,col,border)=>`<button data-act="${act}" style="flex:1;padding:11px;border-radius:9px;border:${border||"none"};background:${bg};color:${col};font-family:${F.disp};font-size:15px;letter-spacing:.05em;cursor:pointer">${label}</button>`;
const mClose=`<button data-close style="width:100%;margin-top:8px;padding:9px;border-radius:9px;border:1px solid ${C.border};background:transparent;color:${C.muted};font-family:${F.mono};font-size:11px;cursor:pointer">Close</button>`;
function showExport(){
  modal(`<div style="font-family:${F.disp};font-size:21px;color:${C.text};margin-bottom:4px">BACKUP YOUR LOGS</div>
    <div style="font-size:11.5px;color:${C.muted};line-height:1.5;margin-bottom:10px">Copy and paste somewhere safe, or download the file.</div>
    <textarea id="expbox" readonly style="width:100%;height:120px;background:${C.bg};border:1px solid ${C.border};border-radius:9px;padding:9px;color:${C.text};font-size:10px;resize:none;outline:none">${e(JSON.stringify(DATA))}</textarea>
    <div style="display:flex;gap:8px;margin-top:12px">${mBtn("docopy","COPY",C.lime,C.ink)}${mBtn("dodownload","DOWNLOAD","transparent",C.blue,"1px solid "+C.blue)}</div>${mClose}`); }
function showImport(){
  modal(`<div style="font-family:${F.disp};font-size:21px;color:${C.text};margin-bottom:4px">RESTORE LOGS</div>
    <div style="font-size:11.5px;color:${C.muted};line-height:1.5;margin-bottom:10px">Paste a backup and tap Restore. It merges into this device.</div>
    <textarea id="impbox" placeholder="Paste your backup text here…" style="width:100%;height:120px;background:${C.bg};border:1px solid ${C.border};border-radius:9px;padding:9px;color:${C.text};font-size:10px;resize:none;outline:none"></textarea>
    <div id="impmsg" style="font-family:${F.mono};font-size:10px;color:${C.orange};margin-top:6px;min-height:12px"></div>
    <div style="display:flex;margin-top:6px">${mBtn("dorestore","RESTORE",C.green,C.ink)}</div>${mClose}`); }

// ── Shell + render ──
function render(){
  const ae=document.activeElement; if(ae&&ae!==document.body&&ae.blur&&!ae.closest("#modal")) ae.blur();
  const TABS=[["train","Train","🏋️"],["run","Run","🏃"],["fuel","Fuel","🍽️"],["progress","Progress","📈"]];
  const inner={train,run,fuel,progress}[S.view]();
  let tabbar=`<div style="position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:${A(C.surface,.96)};border-top:1px solid ${C.border};display:flex;padding:8px 6px calc(env(safe-area-inset-bottom) + 10px);z-index:20">`;
  TABS.forEach(([id,l,ic])=>{ const on=S.view===id;
    tabbar+=`<div data-act="tab" data-v="${id}" style="flex:1;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;padding:2px 0 4px;color:${on?GOLD:C.muted}"><span style="width:18px;height:2px;border-radius:1px;background:${on?GOLD:"transparent"}"></span><span style="font-family:${F.mono};font-size:10px;letter-spacing:.14em;text-transform:uppercase">${l}</span></div>`; });
  tabbar+=`</div>`;
  document.getElementById("root").innerHTML=noEmo(
    `<div style="max-width:480px;margin:0 auto;min-height:100vh;background:${C.bg};color:${C.text}">
      <div style="padding:calc(env(safe-area-inset-top) + 14px) 16px 12px;border-bottom:1px solid ${C.border};position:sticky;top:0;background:${A(C.bg,.94)};backdrop-filter:blur(10px);z-index:10">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <div style="font-family:${F.disp};font-size:21px;letter-spacing:.16em">BACKYARD <span style="color:${GOLD}">ULTRA</span></div>
          <div style="text-align:right"><div style="font-family:${F.disp};font-size:17px;color:${GOLD};line-height:1">${dtr()}</div><div style="font-family:${F.mono};font-size:7.5px;color:${C.muted};letter-spacing:.14em">DAYS</div></div></div>
        <div style="font-family:${F.mono};font-size:9px;color:${C.muted};letter-spacing:.16em;margin-top:2px">BRIGHTON · 6.7 KM EVERY HOUR · 8 MAY 2027</div></div>
      <div style="padding:16px 16px calc(env(safe-area-inset-bottom) + 96px)">${inner}</div>${tabbar}</div>`);
}

// ── Celebration ──
function weekComplete(w){ return getDays(w).every((d,i)=>!isReq(d)||st(w,i).completed); }
function totalDone(){ let n=0; for(let w=1;w<=NWEEKS;w++) getDays(w).forEach((d,i)=>{ if(isReq(d)&&st(w,i).completed) n++; }); return n; }
function tierFor(week,day){
  const days=getDays(week),d=days[day],wc=weekComplete(week),ph=PHASES[phOf(week)-1];
  const count=`Session ${totalDone()} of ${TOTAL} · ${dtr()} days to Brighton`; let t;
  const yl=((st(week,day).yards)||[]).filter(ps).length;
  if(d.race) t={title:"STILL STANDING",emoji:"🏆",sub:(yl?yl+" yards · "+(yl*YARD).toFixed(1)+" km":"Backyard ultra done"),accent:C.lime,confetti:160,big:true};
  else if(d.ttDay) t={title:"TIME TRIAL DONE",emoji:"🎯",sub:"Update your paces from your time",accent:C.blue,confetti:90,big:true};
  else if(d.peak) t={title:"PEAK SIM DONE",emoji:"🔥",sub:"Longest run of your life — banked",accent:C.red,confetti:130,big:true};
  else if(wc&&ph.weeks[ph.weeks.length-1]===week) t={title:ph.title+" COMPLETE",emoji:"💪",sub:"Phase "+ph.id+" banked",accent:C.purple,confetti:100,big:true};
  else if(wc) t={title:"WEEK "+week+" DONE",emoji:"🔥",sub:ph.title+" · ~"+weekKm(week)+" km",accent:C.lime,confetti:65};
  else if(yl) t={title:"YARDS BANKED",emoji:"🕐",sub:yl+" yards · "+(yl*YARD).toFixed(1)+" km",accent:C.lime,confetti:60};
  else t={title:"SESSION DONE",emoji:"🎉",sub:"Week "+week+" · "+d.num+" · "+d.name,accent:C.lime,confetti:38};
  t.count=count; return t;
}
function fireConfetti(box,n){ const cols=["#d4bf94","#f2ede4","#b39b6b","#8a847b","#e9d9b5","#6e6458"];
  for(let i=0;i<n;i++){ const p=document.createElement("span");
    const x=Math.random()*100,dur=1.8+Math.random()*1.7,delay=Math.random()*0.5,w=6+Math.random()*6,h=9+Math.random()*10,rot=((Math.random()*720-360)|0)+"deg";
    p.style.cssText=`position:absolute;left:${x}%;top:-24px;width:${w}px;height:${h}px;background:${cols[i%cols.length]};border-radius:${i%4===0?"50%":"1px"};opacity:.9;animation:conffall ${dur}s linear ${delay}s forwards`;
    p.style.setProperty("--rot",rot); box.appendChild(p); } }
function celebrate(t){
  const old=document.getElementById("celebrate"); if(old) old.remove();
  const wrap=document.createElement("div"); wrap.id="celebrate";
  wrap.style.cssText=`position:fixed;inset:0;z-index:100;background:${A(C.bg,.86)};backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden;animation:ovin .25s ease`;
  const conf=document.createElement("div"); conf.style.cssText="position:absolute;inset:0;pointer-events:none"; wrap.appendChild(conf);
  const card=document.createElement("div");
  card.style.cssText=`position:relative;width:320px;max-width:100%;background:linear-gradient(180deg,${C.card},${C.surface});border:1px solid ${t.accent}66;border-radius:22px;padding:26px 22px 22px;text-align:center`;
  card.innerHTML=noEmo(`<div style="width:74px;height:74px;border-radius:50%;background:${t.accent};display:flex;align-items:center;justify-content:center;margin:0 auto 4px;animation:pop .45s ease"><span style="font-size:40px;color:${C.ink};font-weight:800;line-height:1">✓</span></div>
    <div style="height:10px"></div>
    <div style="font-family:${F.disp};font-size:${t.big?34:32}px;letter-spacing:.03em;color:${C.text};line-height:1.04">${t.title}</div>
    <div style="font-family:${F.mono};font-size:10px;color:${t.accent};letter-spacing:.1em;text-transform:uppercase;margin-top:7px">${e(t.sub)}</div>
    <div style="font-family:${F.mono};font-size:11px;color:${C.muted};margin-top:5px">${t.count}</div>
    <button data-close="1" style="margin-top:18px;width:100%;padding:13px;border-radius:11px;border:none;background:${t.accent};color:${C.ink};font-family:${F.disp};font-size:17px;letter-spacing:.14em;cursor:pointer">KEEP GOING →</button>`);
  wrap.appendChild(card);
  wrap.addEventListener("click",ev=>{ if(ev.target===wrap||ev.target.getAttribute("data-close")){ wrap.style.animation="ovout .2s ease forwards"; setTimeout(()=>wrap.remove(),190); } });
  document.body.appendChild(wrap); fireConfetti(conf,t.confetti);
}

// ── Events ──
const upd=(dk,fn)=>{ const d=DATA[dk]||{}; DATA[dk]=fn({...d}); persist(); };
document.addEventListener("click",ev=>{
  if(ev.target&&ev.target.matches&&ev.target.matches("input,textarea")) return;
  const t=ev.target.closest("[data-act]"); if(!t) return;
  const a=t.getAttribute("data-act"),v=t.getAttribute("data-v"),dk=`w${S.week}d${S.day}`;
  if(a==="order"){S.order=!S.order;render();}
  else if(a==="tab"){S.view=v;render();window.scrollTo(0,0);}
  else if(a==="fuel"){S.fuel=v;render();}
  else if(a==="week"){S.week=+v;S.day=0;render();}
  else if(a==="phase"){S.week=PHASES[+v-1].weeks[0];S.day=0;render();}
  else if(a==="env"){upd(dk,d=>({...d,env:v}));render();}
  else if(a==="gut"){upd(dk,d=>({...d,fuel:{...(d.fuel||{}),gut:+v}}));render();}
  else if(a==="setpaces"){DATA.tenk=+v;persist();t.textContent="✓ PACES UPDATED";setTimeout(render,900);}
  else if(a==="goal"){DATA.goal=+v;persist();render();}
  else if(a==="skip"){ upd(dk,d=>({...d,skipped:true})); const nx=nextAfter(S.week,S.day); if(nx){S.week=nx.w;S.day=nx.i;} render(); window.scrollTo(0,0); }
  else if(a==="unskip"){ upd(dk,d=>({...d,skipped:false})); render(); }
  else if(a==="export"){showExport();}
  else if(a==="import"){showImport();}
  else if(a==="docopy"){ const box=document.getElementById("expbox"); if(!box) return; box.select();
    const done=()=>{t.textContent="✓ COPIED";setTimeout(()=>{t.textContent="COPY";},1500);};
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(box.value).then(done).catch(()=>{try{document.execCommand("copy");done();}catch(_){}}); }
    else { try{document.execCommand("copy");done();}catch(_){} } }
  else if(a==="dodownload"){ try{ const blob=new Blob([JSON.stringify(DATA)],{type:"application/json"}); const url=URL.createObjectURL(blob); const el=document.createElement("a");
      el.href=url; el.download="backyard-backup-"+new Date().toISOString().slice(0,10)+".json"; document.body.appendChild(el); el.click(); el.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000);
      t.textContent="✓ SAVED"; setTimeout(()=>{t.textContent="DOWNLOAD";},1500); }catch(_){ t.textContent="USE COPY"; } }
  else if(a==="dorestore"){ const box=document.getElementById("impbox"),msg=document.getElementById("impmsg"); if(!box) return; let obj;
    try{ obj=JSON.parse(box.value); }catch(_){ if(msg)msg.textContent="Couldn't read that — check you pasted the whole backup."; return; }
    if(!obj||typeof obj!=="object"||Array.isArray(obj)){ if(msg)msg.textContent="That doesn't look like a valid backup."; return; }
    Object.keys(obj).forEach(k=>{ DATA[k]=obj[k]; }); persist(); const m=document.getElementById("modal"); if(m) m.remove(); render(); }
  else if(a==="day"){S.day=+v;render();}
  else if(a==="jump"){S.week=+t.getAttribute("data-w");S.day=+t.getAttribute("data-d");S.view="train";render();window.scrollTo(0,0);}
  else if(a==="jumpweek"){S.week=+t.getAttribute("data-w");S.day=0;S.view="train";render();window.scrollTo(0,0);}
  else if(a==="ex"){ if(ev.target.closest("[data-noex]")) return; const id=t.getAttribute("data-id"),n=+t.getAttribute("data-n")||1;
    upd(dk,d=>{const done={...(d.done||{})};done[id]=!done[id];const sets={...(d.sets||{})};sets[id]=Array.from({length:n},()=>done[id]);return {...d,done,sets};}); const y=window.scrollY; render(); window.scrollTo(0,y); }
  else if(a==="set"){ const id=t.getAttribute("data-id"),k=+t.getAttribute("data-k"),n=+t.getAttribute("data-n");
    upd(dk,d=>{const sets={...(d.sets||{})};const arr=[...(sets[id]||[])];arr[k]=!arr[k];sets[id]=arr;const done={...(d.done||{})};done[id]=Array.from({length:n}).every((_,i)=>arr[i]);return {...d,sets,done};});
    if(navigator.vibrate) try{navigator.vibrate(15);}catch(_){}
    const y=window.scrollY; render(); window.scrollTo(0,y); }
  else if(a==="round"){ const si=+t.getAttribute("data-si"),ri=+t.getAttribute("data-ri"); upd(dk,d=>{const fins={...(d.fins||{})};const arr=[...(fins[si]||[])];arr[ri]=!arr[ri];fins[si]=arr;return {...d,fins};}); render(); }
  else if(a==="complete"){ const now=!(DATA[dk]||{}).completed; upd(dk,d=>({...d,completed:now,skipped:false,completedAt:now?new Date().toISOString():null}));
    if(now){ const tier=tierFor(S.week,S.day); const nx=nextAfter(S.week,S.day); if(nx){S.week=nx.w;S.day=nx.i;} render(); window.scrollTo(0,0); celebrate(tier); } else render(); }
});
// inputs — save without re-render (keeps focus)
document.addEventListener("input",ev=>{ const t=ev.target; if(!t.getAttribute) return; const dk=t.getAttribute("data-dk");
  if(t.getAttribute("data-field")==="note"){ upd(dk,d=>({...d,note:t.value})); }
  else if(t.hasAttribute("data-w")){ const id=t.getAttribute("data-w"),key=t.getAttribute("data-wkey"),si=+t.getAttribute("data-set");
    upd(dk,d=>{const w={...(d.w||{})};const arr=Array.isArray(w[id])?w[id].slice():[];arr[si]=t.value;w[id]=arr;DATA.weights=DATA.weights||{};DATA.weights[key]=arr.slice();return {...d,w};});
    t.style.borderColor=t.value?C.purple:C.border; }
  else if(t.hasAttribute("data-yard")){ const i=+t.getAttribute("data-yard"); upd(dk,d=>{const y=[...(d.yards||[])];y[i]=t.value;return {...d,yards:y};}); }
  else if(t.hasAttribute("data-fuel")){ const k=t.getAttribute("data-fuel"); upd(dk,d=>({...d,fuel:{...(d.fuel||{}),[k]:t.value}})); }
  else if(t.hasAttribute("data-tt")){ upd(dk,d=>({...d,tt:t.value})); }
});
// change (on blur) — recompute summaries
document.addEventListener("change",ev=>{ const t=ev.target; if(!t.getAttribute) return;
  if(t.hasAttribute("data-yard")||t.hasAttribute("data-tt")){ setTimeout(()=>{ const y=window.scrollY, a=document.activeElement, keep=a&&a.getAttribute&&a.getAttribute("data-yard"); render(); window.scrollTo(0,y);
      if(keep!=null){ const n=document.querySelector(`[data-yard="${keep}"]`); if(n) n.focus({preventScroll:true}); } },0); }
  else if(t.hasAttribute("data-tenk")){ const s=ps(t.value); if(s&&s>=1500&&s<=5400){DATA.tenk=s;persist();} setTimeout(render,0); }
});

{ const f=firstIncomplete(); if(f){ S.week=f.w; S.day=f.i; } }
render();

}catch(e){var d=document.getElementById("err");if(d){d.style.display="block";d.textContent="Error:\n"+(e&&e.stack?e.stack:e);}}
</script>

if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
